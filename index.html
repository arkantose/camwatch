<h1>CamWatch</h1>
<p class="sub">A personal home camera app.</p>
<p>CamWatch is a private, single-user app that shows a home webcam on the owner's phone, records clips when it
detects motion, and backs those clips up to the owner's own Google Drive.</p>
<p>It is not a public service and has no other users.</p>
